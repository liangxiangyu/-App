<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>督察地图</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-bar">
    <span class="title" style="margin-right:0;">督察地图</span>
  </div>

  <!-- 搜索与类型筛选 -->
  <div class="search-bar" style="border-bottom:0.5px solid var(--border);">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="搜索编号/标题/关键词" id="searchInput">
    </div>
  </div>
  <div class="category-tabs">
    <div class="cat-item active">全部</div>
    <div class="cat-item">督察问题</div>
    <div class="cat-item">清单问题</div>
    <div class="cat-item">线索问题</div>
  </div>

  <!-- 地图区域 -->
  <div class="map-container" id="mapArea">
    <svg width="100%" height="100%" viewBox="0 0 360 480" style="position:absolute;top:0;left:0;">
      <rect width="360" height="480" fill="#e8eff8"/>
      <path d="M80,200 Q120,150 180,160 T280,180 Q300,220 290,270 T240,340 Q200,380 160,360 T100,300 Q70,260 80,200Z" fill="#c8ddf0" stroke="#a0bdd8" stroke-width="1.5"/>
      <text x="180" y="260" text-anchor="middle" fill="#6b7280" font-size="14">重庆市</text>
    </svg>

    <!-- 点位标记 -->
    <div style="position:absolute;top:180px;left:140px;cursor:pointer;" onclick="location.href='map-detail.html'">
      <div style="width:32px;height:32px;background:var(--primary);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(26,92,255,0.3);">
        <i class="fas fa-exclamation" style="color:#fff;font-size:12px;transform:rotate(45deg);"></i>
      </div>
      <div style="font-size:10px;color:var(--text-secondary);text-align:center;margin-top:4px;white-space:nowrap;">L1QZTS1357</div>
    </div>

    <div style="position:absolute;top:240px;left:220px;cursor:pointer;" onclick="location.href='map-detail.html'">
      <div style="width:32px;height:32px;background:var(--warning);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(255,143,31,0.3);">
        <i class="fas fa-exclamation" style="color:#fff;font-size:12px;transform:rotate(45deg);"></i>
      </div>
      <div style="font-size:10px;color:var(--text-secondary);text-align:center;margin-top:4px;white-space:nowrap;">ST26042920094</div>
    </div>

    <!-- 定位按钮 -->
    <div style="position:absolute;bottom:16px;right:16px;width:40px;height:40px;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);cursor:pointer;">
      <i class="fas fa-crosshairs" style="color:var(--primary);font-size:18px;"></i>
    </div>
  </div>

  <!-- 底部 TabBar -->
  <div class="tab-bar">
    <div class="tab-item" onclick="location.href='problem-list.html'">
      <i class="fas fa-clipboard-list"></i>
      <span>问题</span>
    </div>
    <div class="tab-item" onclick="location.href='supervision-list.html'">
      <i class="fas fa-search-location"></i>
      <span>督察</span>
    </div>
    <div class="tab-item active">
      <i class="fas fa-map-marked-alt"></i>
      <span>地图</span>
    </div>
    <div class="tab-item" onclick="location.href='support.html'">
      <i class="fas fa-hands-helping"></i>
      <span>支持</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.querySelectorAll('.cat-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
      });
    });
    document.getElementById('searchInput').addEventListener('input', function() {
      if (!this.value) {
        const t = document.getElementById('toast');
        t.textContent = '已清空搜索';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1500);
      }
    });
  </script>
</body>
</html>
