<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>线索表单</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .form-opts { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-opts .opt-chip {
      padding: 8px 16px;
      background: var(--bg-page);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      transition: all .15s;
      color: var(--text-secondary);
    }
    .form-opts .opt-chip:active { transform: scale(0.96); }
    .form-opts .opt-chip.active {
      background: var(--primary-light);
      color: var(--primary);
      border-color: var(--primary);
      font-weight: 500;
    }
    .select-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: #fff;
      cursor: pointer;
      transition: border-color .2s;
    }
    .select-field:active { border-color: var(--primary); }
    .select-field .select-val { font-size: 14px; color: var(--text-primary); }
    .select-field .select-placeholder { font-size: 14px; color: var(--text-tertiary); }
    .select-field .select-arrow { font-size: 12px; color: var(--text-tertiary); }
    .dropdown-panel {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4); z-index: 200; display: none;
    }
    .dropdown-panel.show { display: block; }
    .dropdown-panel .dropdown-body {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: var(--bg-card);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px calc(34px + 16px);
      max-height: 50vh; overflow-y: auto;
      animation: slideUp .25s ease-out;
    }
    .dropdown-panel .dropdown-title {
      font-size: 16px; font-weight: 600;
      text-align: center; margin-bottom: 16px;
    }
    .dropdown-panel .dropdown-list { padding: 0; }
    .dropdown-panel .dropdown-item {
      padding: 14px 16px;
      font-size: 15px;
      border-bottom: 0.5px solid var(--border-light);
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: background .15s;
    }
    .dropdown-panel .dropdown-item:active { background: var(--bg-page); }
    .dropdown-panel .dropdown-item:last-child { border-bottom: none; }
    .dropdown-panel .dropdown-item.selected { color: var(--primary); font-weight: 500; }
    .dropdown-panel .dropdown-item.selected::after {
      content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
      font-size: 14px; color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-bar">
    <i class="fas fa-chevron-left back" onclick="location.href='clue-list.html'"></i>
    <span class="title">新增线索</span>
  </div>

  <div class="segment-tabs" style="padding:4px 16px;">
    <div class="seg-item active" onclick="switchSource(0, this)">发现类线索</div>
    <div class="seg-item" onclick="switchSource(1, this)">舆情类线索</div>
  </div>

  <div class="page-content" style="padding-bottom:120px;">
    <div id="formSource0">
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 线索标题</div>
        <input type="text" class="form-control" id="clueTitle" placeholder="请输入线索标题" value="铜梁安居国家湿地公园新线索">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 发现情况</div>
        <textarea class="form-control" id="clueSituation" rows="3" placeholder="请输入发现情况">现场核查发现相关设施未按要求处置</textarea>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 行政区划</div>
        <div class="select-field" onclick="openDropdown('region')">
          <span class="select-val" id="regionVal">铜梁</span>
          <i class="fas fa-chevron-down select-arrow"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 领域</div>
        <div class="select-field" onclick="openDropdown('domain')">
          <span class="select-val" id="domainVal">自然生态保护和修复</span>
          <i class="fas fa-chevron-down select-arrow"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 来源</div>
        <div class="form-opts" id="optSource0">
          <div class="opt-chip active" onclick="selectChip(this)">督察发现</div>
          <div class="opt-chip" onclick="selectChip(this)">信访投诉</div>
          <div class="opt-chip" onclick="selectChip(this)">媒体曝光</div>
          <div class="opt-chip" onclick="selectChip(this)">群众举报</div>
          <div class="opt-chip" onclick="selectChip(this)">其他</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 发现日期</div>
        <input type="date" class="form-control" id="clueDate" value="2026-07-10">
      </div>
      <div class="form-group">
        <div class="form-label">定位数据</div>
        <div style="width:100%;height:120px;background:#e8eff8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer;">
          <div style="text-align:center;">
            <i class="fas fa-map-marker-alt" style="font-size:24px;color:var(--primary);"></i>
            <div style="font-size:12px;margin-top:4px;">点击选择定位</div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">附件</div>
        <div style="display:flex;align-items:center;gap:8px;padding:12px;border:1px dashed var(--border);border-radius:8px;color:var(--text-tertiary);cursor:pointer;">
          <i class="fas fa-cloud-upload-alt"></i>
          <span style="font-size:13px;">点击上传附件</span>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">线索照片</div>
        <div style="display:flex;gap:8px;">
          <div style="width:72px;height:72px;background:var(--bg-page);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);cursor:pointer;">
            <i class="fas fa-camera" style="font-size:20px;color:var(--text-tertiary);"></i>
          </div>
        </div>
      </div>
    </div>

    <div id="formSource1" style="display:none;">
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 时间</div>
        <input type="datetime-local" class="form-control" id="opTime" value="2026-07-10T09:30">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 标题</div>
        <input type="text" class="form-control" id="opTitle" placeholder="请输入舆情标题">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 内容</div>
        <textarea class="form-control" id="opContent" rows="3" placeholder="请输入舆情内容"></textarea>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 来源</div>
        <div class="form-opts" id="optSource1">
          <div class="opt-chip active" onclick="selectChip(this)">网络媒体</div>
          <div class="opt-chip" onclick="selectChip(this)">社交平台</div>
          <div class="opt-chip" onclick="selectChip(this)">论坛社区</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">媒体分类</div>
        <div class="form-opts">
          <div class="opt-chip" onclick="selectChip(this)">中央媒体</div>
          <div class="opt-chip" onclick="selectChip(this)">地方媒体</div>
          <div class="opt-chip" onclick="selectChip(this)">自媒体</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 行政区划</div>
        <div class="select-field" onclick="openDropdown('opRegion')">
          <span class="select-placeholder" id="opRegionVal">请选择行政区划</span>
          <i class="fas fa-chevron-down select-arrow"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">污染源领域</div>
        <div class="form-opts">
          <div class="opt-chip" onclick="selectChip(this)">水污染</div>
          <div class="opt-chip" onclick="selectChip(this)">大气污染</div>
          <div class="opt-chip" onclick="selectChip(this)">固体废物</div>
          <div class="opt-chip" onclick="selectChip(this)">噪声污染</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">链接</div>
        <input type="url" class="form-control" placeholder="请输入舆情链接">
      </div>
      <div class="form-group">
        <div class="form-label">回复情况</div>
        <textarea class="form-control" rows="2" placeholder="请输入回复情况（选填）"></textarea>
      </div>
      <div class="form-group">
        <div class="form-label">定位数据</div>
        <div style="width:100%;height:120px;background:#e8eff8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);">
          <div style="text-align:center;">
            <i class="fas fa-map-marker-alt" style="font-size:24px;color:var(--primary);"></i>
            <div style="font-size:12px;margin-top:4px;">点击选择定位</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(34px + 12px);background:#fff;border-top:0.5px solid #e5e7eb;display:flex;gap:10px;">
    <button class="btn btn-outline" style="flex:1;" onclick="saveForm()">保存</button>
    <button class="btn btn-primary" style="flex:1;" onclick="submitForm()">保存并提交</button>
  </div>

  <div class="dropdown-panel" id="dropdownPanel">
    <div class="dropdown-body">
      <div class="dropdown-title" id="dropdownTitle">选择</div>
      <div class="dropdown-list" id="dropdownList"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var currentSourceIdx = 0;
    var currentDropdownType = '';
    var dropdownData = {
      region: { 
        title: '选择行政区划', 
        items: ['铜梁', '渝北', '巫山', '綦江', '合川', '江津', '大足', '万州', '涪陵', '沙坪坝']
      },
      opRegion: { 
        title: '选择行政区划', 
        items: ['铜梁', '渝北', '巫山', '綦江', '合川', '江津', '大足', '万州', '涪陵', '沙坪坝']
      },
      domain: {
        title: '选择领域',
        items: ['自然生态保护和修复', '水污染防治', '大气污染防治', '固体废物污染防治', '噪声污染防治', '土壤污染防治']
      }
    };

    function switchSource(idx, el) {
      currentSourceIdx = idx;
      document.querySelectorAll('.segment-tabs .seg-item').forEach(function(s) { s.classList.remove('active'); });
      el.classList.add('active');
      document.getElementById('formSource0').style.display = idx === 0 ? 'block' : 'none';
      document.getElementById('formSource1').style.display = idx === 1 ? 'block' : 'none';
    }

    function selectChip(el) {
      var siblings = el.parentElement.querySelectorAll('.opt-chip');
      siblings.forEach(function(s) { s.classList.remove('active'); });
      el.classList.add('active');
    }

    function openDropdown(type) {
      currentDropdownType = type;
      var data = dropdownData[type];
      document.getElementById('dropdownTitle').textContent = data.title;
      var list = document.getElementById('dropdownList');
      var currentVal = '';
      
      if (type === 'region') {
        currentVal = document.getElementById('regionVal').textContent;
      } else if (type === 'domain') {
        currentVal = document.getElementById('domainVal').textContent;
      } else if (type === 'opRegion') {
        var opVal = document.getElementById('opRegionVal');
        currentVal = opVal.classList.contains('select-placeholder') ? '' : opVal.textContent;
      }
      
      var html = '';
      data.items.forEach(function(item) {
        var sel = item === currentVal ? ' selected' : '';
        html += '<div class="dropdown-item' + sel + '" onclick="selectDropdownItem(this)">' + item + '</div>';
      });
      list.innerHTML = html;
      document.getElementById('dropdownPanel').classList.add('show');
    }

    function selectDropdownItem(el) {
      var valEl;
      if (currentDropdownType === 'region') {
        valEl = document.getElementById('regionVal');
        valEl.textContent = el.textContent;
      } else if (currentDropdownType === 'domain') {
        valEl = document.getElementById('domainVal');
        valEl.textContent = el.textContent;
      } else if (currentDropdownType === 'opRegion') {
        valEl = document.getElementById('opRegionVal');
        valEl.textContent = el.textContent;
        valEl.classList.remove('select-placeholder');
        valEl.classList.add('select-val');
      }
      
      document.getElementById('dropdownPanel').classList.remove('show');
      showToast('已选择：' + el.textContent);
    }

    document.getElementById('dropdownPanel').addEventListener('click', function(e) {
      if (e.target === this) { this.classList.remove('show'); }
    });

    function saveForm() { showToast('保存成功'); }

    function submitForm() {
      if (currentSourceIdx === 0) {
        var title = document.getElementById('clueTitle');
        var situation = document.getElementById('clueSituation');
        var date = document.getElementById('clueDate');
        if (!title.value.trim()) { showToast('请输入线索标题'); title.focus(); return; }
        if (!situation.value.trim()) { showToast('请输入发现情况'); situation.focus(); return; }
        if (!date.value) { showToast('请选择发现日期'); return; }
      } else {
        var opTitle = document.getElementById('opTitle');
        var opContent = document.getElementById('opContent');
        var opTime = document.getElementById('opTime');
        var opRegionEl = document.getElementById('opRegionVal');
        if (!opTime.value) { showToast('请选择时间'); return; }
        if (!opTitle.value.trim()) { showToast('请输入舆情标题'); opTitle.focus(); return; }
        if (!opContent.value.trim()) { showToast('请输入舆情内容'); opContent.focus(); return; }
        if (opRegionEl.classList.contains('select-placeholder')) { 
          showToast('请选择行政区划'); 
          return; 
        }
      }
      showToast('提交成功');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 1500);
    }
  </script>
</body>
</html>
