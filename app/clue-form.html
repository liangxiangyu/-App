<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>线索表单</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-bar">
    <i class="fas fa-chevron-left back" onclick="location.href='clue-list.html'"></i>
    <span class="title">新增线索</span>
  </div>

  <div class="segment-tabs" style="padding:4px 16px;">
    <div class="seg-item active" onclick="switchSource(0, this)">发现类线索</div>
    <div class="seg-item" onclick="switchSource(1, this)">舆情类线索</div>
  </div>

  <div class="page-content" style="padding-bottom:120px;">
    <div id="formSource0">
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 线索标题</div>
        <input type="text" class="form-control" id="clueTitle" placeholder="请输入线索标题" value="铜梁安居国家湿地公园新线索">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 发现情况</div>
        <textarea class="form-control" id="clueSituation" rows="3" placeholder="请输入发现情况">现场核查发现相关设施未按要求处置</textarea>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 行政区划</div>
        <div class="form-control form-select" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="showPicker('行政区划')">
          <span id="regionVal">铜梁</span>
          <i class="fas fa-chevron-right" style="font-size:12px;color:var(--text-tertiary);"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 领域</div>
        <div class="form-control form-select" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="showPicker('领域')">
          <span id="domainVal">自然生态保护和修复</span>
          <i class="fas fa-chevron-right" style="font-size:12px;color:var(--text-tertiary);"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 来源</div>
        <div class="options" id="optSource0" style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="opt-item active" onclick="selectOpt(this)">督察发现</div>
          <div class="opt-item" onclick="selectOpt(this)">信访投诉</div>
          <div class="opt-item" onclick="selectOpt(this)">媒体曝光</div>
          <div class="opt-item" onclick="selectOpt(this)">群众举报</div>
          <div class="opt-item" onclick="selectOpt(this)">其他</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 发现日期</div>
        <input type="date" class="form-control" id="clueDate" value="2026-07-10">
      </div>
      <div class="form-group">
        <div class="form-label">定位数据</div>
        <div style="width:100%;height:120px;background:#e8eff8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);cursor:pointer;">
          <div style="text-align:center;">
            <i class="fas fa-map-marker-alt" style="font-size:24px;color:var(--primary);"></i>
            <div style="font-size:12px;margin-top:4px;">点击选择定位</div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">附件</div>
        <div style="display:flex;align-items:center;gap:8px;padding:12px;border:1px dashed var(--border);border-radius:8px;color:var(--text-tertiary);cursor:pointer;">
          <i class="fas fa-cloud-upload-alt"></i>
          <span style="font-size:13px;">点击上传附件</span>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">线索照片</div>
        <div style="display:flex;gap:8px;">
          <div style="width:72px;height:72px;background:var(--bg-page);border-radius:8px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);cursor:pointer;">
            <i class="fas fa-camera" style="font-size:20px;color:var(--text-tertiary);"></i>
          </div>
        </div>
      </div>
    </div>

    <div id="formSource1" style="display:none;">
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 时间</div>
        <input type="datetime-local" class="form-control" id="opTime" value="2026-07-10T09:30">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 标题</div>
        <input type="text" class="form-control" id="opTitle" placeholder="请输入舆情标题">
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 内容</div>
        <textarea class="form-control" id="opContent" rows="3" placeholder="请输入舆情内容"></textarea>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 来源</div>
        <div class="options" id="optSource1" style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="opt-item active" onclick="selectOpt(this)">网络媒体</div>
          <div class="opt-item" onclick="selectOpt(this)">社交平台</div>
          <div class="opt-item" onclick="selectOpt(this)">论坛社区</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">媒体分类</div>
        <div class="options" style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="opt-item" onclick="selectOpt(this)">中央媒体</div>
          <div class="opt-item" onclick="selectOpt(this)">地方媒体</div>
          <div class="opt-item" onclick="selectOpt(this)">自媒体</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label"><span class="required">*</span> 行政区划</div>
        <div class="form-control form-select" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="showPicker('行政区划')">
          <span id="opRegionVal" style="color:var(--text-tertiary);">请选择行政区划</span>
          <i class="fas fa-chevron-right" style="font-size:12px;color:var(--text-tertiary);"></i>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">污染源领域</div>
        <div class="options" style="display:flex;gap:8px;flex-wrap:wrap;">
          <div class="opt-item" onclick="selectOpt(this)">水污染</div>
          <div class="opt-item" onclick="selectOpt(this)">大气污染</div>
          <div class="opt-item" onclick="selectOpt(this)">固体废物</div>
          <div class="opt-item" onclick="selectOpt(this)">噪声污染</div>
        </div>
      </div>
      <div class="form-group">
        <div class="form-label">链接</div>
        <input type="url" class="form-control" placeholder="请输入舆情链接">
      </div>
      <div class="form-group">
        <div class="form-label">回复情况</div>
        <textarea class="form-control" rows="2" placeholder="请输入回复情况（选填）"></textarea>
      </div>
      <div class="form-group">
        <div class="form-label">定位数据</div>
        <div style="width:100%;height:120px;background:#e8eff8;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-tertiary);">
          <div style="text-align:center;">
            <i class="fas fa-map-marker-alt" style="font-size:24px;color:var(--primary);"></i>
            <div style="font-size:12px;margin-top:4px;">点击选择定位</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(34px + 12px);background:#fff;border-top:0.5px solid #e5e7eb;display:flex;gap:10px;">
    <button class="btn btn-outline" style="flex:1;" onclick="saveForm()">保存</button>
    <button class="btn btn-primary" style="flex:1;" onclick="submitForm()">保存并提交</button>
  </div>

  <div class="filter-panel" id="pickerPanel">
    <div class="panel-body">
      <div class="panel-title" id="pickerTitle">选择</div>
      <div style="padding:16px 0;" id="pickerOpts">
        <div class="opt-item" style="margin:4px;display:inline-block;" onclick="selectPickerItem(this)">铜梁</div>
        <div class="opt-item" style="margin:4px;display:inline-block;" onclick="selectPickerItem(this)">渝北</div>
        <div class="opt-item" style="margin:4px;display:inline-block;" onclick="selectPickerItem(this)">巫山</div>
        <div class="opt-item" style="margin:4px;display:inline-block;" onclick="selectPickerItem(this)">綦江</div>
        <div class="opt-item" style="margin:4px;display:inline-block;" onclick="selectPickerItem(this)">合川</div>
      </div>
      <div class="panel-actions">
        <button class="btn btn-outline" style="flex:1;" onclick="closePicker()">取消</button>
        <button class="btn btn-primary" style="flex:1;" onclick="confirmPicker()">确定</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    var currentSourceIdx = 0;
    var currentPickerField = '';

    function switchSource(idx, el) {
      currentSourceIdx = idx;
      document.querySelectorAll('.segment-tabs .seg-item').forEach(function(s) { s.classList.remove('active'); });
      el.classList.add('active');
      document.getElementById('formSource0').style.display = idx === 0 ? 'block' : 'none';
      document.getElementById('formSource1').style.display = idx === 1 ? 'block' : 'none';
    }

    function selectOpt(el) {
      var siblings = el.parentElement.querySelectorAll('.opt-item');
      siblings.forEach(function(s) { s.classList.remove('active'); });
      el.classList.add('active');
    }

    function showPicker(field) {
      currentPickerField = field;
      document.getElementById('pickerTitle').textContent = '选择' + field;
      document.getElementById('pickerPanel').classList.add('show');
    }

    function closePicker() {
      document.getElementById('pickerPanel').classList.remove('show');
    }

    function selectPickerItem(el) {
      el.parentElement.querySelectorAll('.opt-item').forEach(function(s) { s.classList.remove('active'); });
      el.classList.add('active');
    }

    function confirmPicker() {
      var selected = document.querySelector('#pickerOpts .opt-item.active');
      if (selected) {
        if (currentPickerField === '行政区划') {
          if (currentSourceIdx === 0) {
            document.getElementById('regionVal').textContent = selected.textContent;
          } else {
            var opR = document.getElementById('opRegionVal');
            opR.textContent = selected.textContent;
            opR.style.color = 'var(--text-primary)';
          }
        }
      }
      closePicker();
      showToast('已选择');
    }

    function saveForm() { showToast('保存成功'); }

    function submitForm() {
      if (currentSourceIdx === 0) {
        var title = document.getElementById('clueTitle');
        var situation = document.getElementById('clueSituation');
        var date = document.getElementById('clueDate');
        if (!title.value.trim()) { showToast('请输入线索标题'); title.focus(); return; }
        if (!situation.value.trim()) { showToast('请输入发现情况'); situation.focus(); return; }
        if (!date.value) { showToast('请选择发现日期'); return; }
      } else {
        var opTitle = document.getElementById('opTitle');
        var opContent = document.getElementById('opContent');
        var opTime = document.getElementById('opTime');
        if (!opTime.value) { showToast('请选择时间'); return; }
        if (!opTitle.value.trim()) { showToast('请输入舆情标题'); opTitle.focus(); return; }
        if (!opContent.value.trim()) { showToast('请输入舆情内容'); opContent.focus(); return; }
      }
      showToast('提交成功');
    }

    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 1500);
    }
  </script>
</body>
</html>
