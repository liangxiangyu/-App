<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>督察支持</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-bar">
    <span class="title" style="margin-right:0;">督察支持</span>
  </div>

  <!-- 搜索栏 -->
  <div class="search-bar">
    <div class="search-wrap">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="搜索文件名称" id="searchInput">
    </div>
  </div>

  <!-- 分类筛选 -->
  <div class="category-tabs">
    <div class="cat-item active">全部</div>
    <div class="cat-item">整改方案</div>
    <div class="cat-item">约谈纪要</div>
    <div class="cat-item">督办函</div>
    <div class="cat-item">会议纪要</div>
  </div>

  <!-- 文件列表 -->
  <div class="page-content">
    <div class="file-item">
      <div class="file-icon pdf"><i class="fas fa-file-pdf"></i></div>
      <div class="file-name">4.关于合川区2025年春节期间燃放烟花爆竹管控不力…整改方案.pdf</div>
    </div>
    <div class="file-item">
      <div class="file-icon doc"><i class="fas fa-file-word"></i></div>
      <div class="file-name">2.约谈纪要 (2025-1).doc</div>
    </div>
    <div class="file-item">
      <div class="file-icon pdf"><i class="fas fa-file-pdf"></i></div>
      <div class="file-name">3.綦江区矿井水整治效果巩固方案（2025修订版）.pdf</div>
    </div>
    <div class="file-item">
      <div class="file-icon doc"><i class="fas fa-file-word"></i></div>
      <div class="file-name">1.巫山县饮用水源保护区码头搬迁督办函.docx</div>
    </div>
    <div class="file-item">
      <div class="file-icon pdf"><i class="fas fa-file-pdf"></i></div>
      <div class="file-name">5.铜梁区安居湿地公园生态修复专项方案.pdf</div>
    </div>
    <div class="file-item">
      <div class="file-icon doc"><i class="fas fa-file-word"></i></div>
      <div class="file-name">6.2026年第三批次督察工作会议纪要.doc</div>
    </div>
    <div class="file-item">
      <div class="file-icon pdf"><i class="fas fa-file-pdf"></i></div>
      <div class="file-name">7.渝北区雷达导航塔辐射监测报告.pdf</div>
    </div>
    <div class="file-item">
      <div class="file-icon doc"><i class="fas fa-file-word"></i></div>
      <div class="file-name">8.长江经济带生态环境警示片问题整改台账.docx</div>
    </div>
  </div>

  <!-- 底部 TabBar -->
  <div class="tab-bar">
    <div class="tab-item" onclick="location.href='problem-list.html'">
      <i class="fas fa-clipboard-list"></i>
      <span>问题</span>
    </div>
    <div class="tab-item" onclick="location.href='supervision-list.html'">
      <i class="fas fa-search-location"></i>
      <span>督察</span>
    </div>
    <div class="tab-item" onclick="location.href='map.html'">
      <i class="fas fa-map-marked-alt"></i>
      <span>地图</span>
    </div>
    <div class="tab-item active">
      <i class="fas fa-hands-helping"></i>
      <span>支持</span>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.querySelectorAll('.cat-item').forEach(item => {
      item.addEventListener('click', function() {
        document.querySelectorAll('.cat-item').forEach(c => c.classList.remove('active'));
        this.classList.add('active');
      });
    });
    document.getElementById('searchInput').addEventListener('input', function() {
      if (!this.value) {
        showToast('已清空搜索');
      }
    });
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1500);
    }
  </script>
</body>
</html>
