<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>更多查询条件</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <i class="fas fa-signal"></i>
      <i class="fas fa-wifi"></i>
      <i class="fas fa-battery-full"></i>
    </div>
  </div>

  <div class="nav-bar">
    <i class="fas fa-chevron-left back" onclick="location.href='problem-list.html'"></i>
    <span class="title">更多查询条件</span>
  </div>

  <div class="page-content" style="padding-bottom:100px;">
    <div style="padding:16px;">
      <div class="option-group">
        <div class="option-label">督导单位</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">督察一处</div>
          <div class="opt-item">督察二处</div>
          <div class="opt-item">督察三处</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">问题来源</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">第三轮中央督察</div>
          <div class="opt-item">第二轮中央督察</div>
          <div class="opt-item">第一轮中央督察</div>
          <div class="opt-item">长江经济带警示片</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">发生领域</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">饮用水水源地生态环境保护</div>
          <div class="opt-item">矿产资源合理利用和保护</div>
          <div class="opt-item">自然生态保护和修复</div>
          <div class="opt-item">大气污染防治</div>
          <div class="opt-item">水污染防治</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">整改状态</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">未整改</div>
          <div class="opt-item">整改中</div>
          <div class="opt-item">已办结</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">临期超期情况</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">正常</div>
          <div class="opt-item">临期</div>
          <div class="opt-item">超期</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">督导状态</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">未核查</div>
          <div class="opt-item">核查中</div>
          <div class="opt-item">已核查</div>
        </div>
      </div>

      <div class="option-group">
        <div class="option-label">督导后风险</div>
        <div class="options">
          <div class="opt-item active">全部</div>
          <div class="opt-item">未评估</div>
          <div class="opt-item">低风险</div>
          <div class="opt-item">中风险</div>
          <div class="opt-item">高风险</div>
        </div>
      </div>
    </div>
  </div>

  <div style="position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(34px + 12px);background:#fff;border-top:0.5px solid #e5e7eb;display:flex;gap:10px;">
    <button class="btn btn-outline" style="flex:1;" onclick="location.href='problem-list.html'">取消</button>
    <button class="btn btn-outline" style="flex:1;" onclick="resetAll()">重置</button>
    <button class="btn btn-primary" style="flex:1;" onclick="confirmFilter()">确定</button>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    document.querySelectorAll('.opt-item').forEach(function(item) {
      item.addEventListener('click', function() {
        var siblings = this.parentElement.querySelectorAll('.opt-item');
        siblings.forEach(function(s) { s.classList.remove('active'); });
        this.classList.add('active');
      });
    });
    function resetAll() {
      document.querySelectorAll('.option-group').forEach(function(group) {
        var items = group.querySelectorAll('.opt-item');
        items.forEach(function(i) { i.classList.remove('active'); });
        if (items[0]) items[0].classList.add('active');
      });
      showToast('已重置所有条件');
    }
    function confirmFilter() {
      showToast('筛选条件已应用');
      setTimeout(function() { location.href = 'problem-list.html'; }, 800);
    }
    function showToast(msg) {
      var t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(function() { t.classList.remove('show'); }, 1500);
    }
  </script>
</body>
</html>
