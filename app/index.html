<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>督察APP 高保真原型</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
      background: #1a1a2e;
      min-height: 100vh;
      padding: 30px 20px;
    }
    .page-header {
      max-width: 1800px;
      margin: 0 auto 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }
    .header-main {
      flex: 1;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: #8b8fa3;
      font-size: 13px;
    }
    .qr-panel {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #fff;
      padding: 20px 24px;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }
    .qr-image {
      width: 140px;
      height: 140px;
      display: block;
      border-radius: 8px;
      border: 2px solid #f0f0f0;
      flex-shrink: 0;
      background: #f8f9fa;
    }
    .qr-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 220px;
    }
    .qr-title {
      font-size: 15px;
      color: #333;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qr-desc {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      max-width: 1800px;
      margin: 0 auto;
    }
    .phone-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .phone-label {
      color: #c4c7d4;
      font-size: 12px;
      text-align: center;
      max-width: 220px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .phone-frame {
      width: 376px;
      height: 796px;
      border-radius: 44px;
      border: 8px solid #2d2d44;
      overflow: hidden;
      background: #f5f7fa;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      position: relative;
    }
    .phone-frame iframe {
      width: 360px;
      height: 780px;
      border: none;
      display: block;
    }
    .phone-frame::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 25px;
      background: #2d2d44;
      border-radius: 12px;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header class="page-header">
    <div class="header-main">
      <h1>督察APP 高保真原型</h1>
      <p class="subtitle">iPhone 16 Pro · 360×780 逻辑视口 · 点击各界面可交互</p>
    </div>
    <div class="qr-panel">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=140x140&data=https://liangxiangyu.github.io/-App/app/preview.html" alt="扫码预览" class="qr-image">
      <div class="qr-info">
        <div class="qr-title">📱 手机扫码预览</div>
        <div class="qr-desc">使用微信或浏览器扫描左侧二维码，即可在手机端查看完整原型并交互</div>
      </div>
    </div>
  </header>
  <div class="grid">
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="problem-list.html"></iframe></div>
      <span class="phone-label">清单问题列表</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="problem-filter.html"></iframe></div>
      <span class="phone-label">清单问题·更多查询条件</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="problem-detail.html"></iframe></div>
      <span class="phone-label">问题管理（详情）</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="supervision-form.html"></iframe></div>
      <span class="phone-label">督导表单</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="clue-list.html"></iframe></div>
      <span class="phone-label">线索问题列表</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="clue-detail.html"></iframe></div>
      <span class="phone-label">线索详情</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="clue-form.html"></iframe></div>
      <span class="phone-label">线索表单（新增/修改）</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="inspection-list.html"></iframe></div>
      <span class="phone-label">督察问题列表</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="inspection-detail.html"></iframe></div>
      <span class="phone-label">督察问题详情</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="supervision-list.html"></iframe></div>
      <span class="phone-label">督导列表</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="map.html"></iframe></div>
      <span class="phone-label">督察地图</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="map-detail.html"></iframe></div>
      <span class="phone-label">地图详情</span>
    </div>
    <div class="phone-wrap">
      <div class="phone-frame"><iframe src="support.html"></iframe></div>
      <span class="phone-label">督察支持</span>
    </div>
  </div>
</body>
</html>
